spring.application.name=micro-warehouse
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.com.quickcart=INFO

# --- MySQL connection (override with env vars DB_URL / DB_USER / DB_PASSWORD) ---
warehouse.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/micro_warehouse?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
warehouse.datasource.username=${DB_USER:root}
warehouse.datasource.password=${DB_PASSWORD:Jeevann}

# --- Run schema.sql + data.sql on startup (both are idempotent) ---
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# --- Business rules ---
warehouse.restock.default-threshold=10
